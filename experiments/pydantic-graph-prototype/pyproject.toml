[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pg-factory"
version = "0.1.0"
description = "Prototype: pydantic-graph as Factory workflow engine"
requires-python = ">=3.12"
dependencies = [
    "pydantic-graph>=0.2",
    "structlog>=24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pyright>=1.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
include = ["src"]
