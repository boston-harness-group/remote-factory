[project]
name = "remote-factory"
dynamic = ["version"]
description = "A harness for agentic software evolution — detect, delegate, evaluate, archive"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "structlog>=24.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "mcp>=1.27.0",
    "pyyaml>=6.0",
    "filelock>=3.0",
    "networkx>=3.6.1",
    "langfuse>=3.0",
    "anthropic[vertex]>=0.52",
    "mempalace>=3.6.0",
    "graphifyy>=0.9",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
    "Intended Audience :: Developers",
]

[project.urls]
Homepage = "https://github.com/akashgit/remote-factory"
Repository = "https://github.com/akashgit/remote-factory"
Issues = "https://github.com/akashgit/remote-factory/issues"

[project.optional-dependencies]
migrate = ["tomli_w>=1.0"]
telemetry = ["langfuse>=3.0"]  # kept for backward compat; langfuse is now a core dep
# The OpenShell Python SDK pulls gRPC/protobuf/cloudpickle; only `factory contained --target
# openshell` needs it, so it stays out of the default install.
contained-openshell = ["openshell>=0.1"]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
git_describe_command = ["git", "describe", "--dirty", "--tags", "--long", "--match", "v*"]
version_scheme = "guess-next-dev"
fallback_version = "0.0.0"

[tool.hatch.build.hooks.vcs]
version-file = "factory/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["factory"]

[project.entry-points."factory.plugins"]
composed_modes = "factory.workflow.packages:register"

[project.scripts]
factory = "factory.cli:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
strict_markers = true
markers = [
    "real_worktree: use real git worktree functions instead of mocks",
    "slow: tests that make real API calls (deselect with -m 'not slow')",
    "smoke: fast smoke tests for core factory modes (detect, discover, study, design, create, agent, refactory)",
    "e2e: end-to-end tests that exercise full CLI pipelines",
]

[tool.coverage.run]
branch = true
source = ["factory"]
omit = [
    "tests/*",
    "eval/*",
    "factory/dashboard/*",
]

[tool.coverage.report]
show_missing = true
skip_empty = true

[tool.ruff]
line-length = 100
extend-exclude = ["mkdocs.yml"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.10",
    "pytest-cov>=5.0",
    "pytest-xdist>=3.5",
    "pytest-timeout>=2.0",
    "httpx>=0.27",
    "types-pyyaml>=6.0",
    "types-networkx>=3.6.1.20260612",
]
docs = ["mkdocs-material>=9.5"]
